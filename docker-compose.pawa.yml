# Pawa - Discord Voice Recording Bot
# This compose file is included by the parent razzorstack docker-compose.yml
# via: include: - path: pawa/docker-compose.pawa.yml
#
# pawa-db: postgres:15.2 instance repurposed from the retired jellystat-db
# container (runtime rename jellystat-db -> pawa-db, 2026-10-04). Env var
# names keep the historical JELLYSTAT_POSTGRES_* interpolation names; the
# runtime .env carries the values. Never `source` that .env — the password
# contains `$`.

services:
  pawa:
    image: registry.gitlab.com/pawabot/pawa:${PAWA_VERSION:-2.17.0}
    container_name: pawa
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    environment:
      - BOT_TOKEN=${PAWA_BOT_TOKEN}
      - BOT_DATA_DIR=/data
      - BOT_FILE_FORMAT=${PAWA_FILE_FORMAT:-mp3}
      - BOT_HTTP_PORT=7888
      - BOT_RECORDER_TYPE=${PAWA_RECORDER_TYPE:-LEGACY}
      - BOT_STANDALONE=true
      - BOT_WEBSITE=https://pawa.razzormail.com
      - BOT_ACTIVITY=Voice Recording
      - BOT_MAINTENANCE=false
      - BOT_MP3_VBR=0
      - BOT_PREFIX_COMMANDS=true
      - BOT_LEAVE_GUILD_AFTER=0
      - DS_BUCKET=/data/datastore
      - DB_NAME=${PAWA_DB_NAME:-pawa}
      - DB_HOST=pawa-db
      - DB_USER=${JELLYSTAT_POSTGRES_USER:-postgres}
      - DB_PASSWORD=${JELLYSTAT_POSTGRES_PASSWORD}
      - TZ=${TZ}
      - OTEL_JAVAAGENT_ENABLED=false
      - JAVA_TOOL_OPTIONS=-Dlog4j.configurationFile=log4j2-prod.xml
                          --add-opens=java.base/java.lang=ALL-UNNAMED
                          -XX:MinRAMPercentage=${PAWA_JVM_MIN_RAM:-25}
                          -XX:MaxRAMPercentage=${PAWA_JVM_MAX_RAM:-75}
                          -XX:+CrashOnOutOfMemoryError
    volumes:
      - ${PAWA_RECORDINGS_PATH:-/home/daffy/pawa-recordings}:/data
      - pawa_logs:/app/logs
    networks:
      - media_network
      - backend_network # reaches pawa-db on the internal DB network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      pawa-db:
        condition: service_healthy

  pawa-db:
    image: postgres:15.2
    container_name: pawa-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${JELLYSTAT_POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${JELLYSTAT_POSTGRES_PASSWORD:-jellystat_password}
      - POSTGRES_DB=${JELLYSTAT_POSTGRES_DB:-jfstat}
      - TZ=${TZ}
    volumes:
      - jellystat_db:/var/lib/postgresql/data
      - ./postgres-initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - backend_network # databases only on internal network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${JELLYSTAT_POSTGRES_USER:-postgres} -d ${JELLYSTAT_POSTGRES_DB:-jfstat}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pawa_logs:
  jellystat_db: # same named volume the retired jellystat-db used (razzorstack_jellystat_db)

networks:
  media_network:
    external: true
    name: razzorstack_media_network
  backend_network:
    external: true
    name: razzorstack_backend_network